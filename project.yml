name: MemoryPalace
options:
  bundleIdPrefix: com.susu
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38"

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  VariableBlur:
    url: https://github.com/nikstar/VariableBlur
    from: "1.3.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

settings:
  base:
    SWIFT_VERSION: "5.10"

targets:
  MemoryPalaceIOS:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "18.0"
    sources:
      - path: MemoryPalace
      # 显式声明 message-renderer.html 进 Copy Bundle Resources。
      # XcodeGen 默认就把 .html 归到 resources phase，这里再写一遍保证万无一失
      # （Bundle.main.url(forResource:"message-renderer") 运行时必须能找到）。
      - path: MemoryPalace/Resources/message-renderer.html
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
      - package: VariableBlur
      - package: ZIPFoundation
    entitlements:
      path: MemoryPalace/MemoryPalaceIOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: MemoryPalace/Info-iOS.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bunny.lostinblossom
        PRODUCT_NAME: "Lost in Blossom"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "保存便签图片到相册"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Lost in Blossom 需要读取你的步数和睡眠数据，让 Caelum 关心你的健康。"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual

  StickerProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget:
      iOS: "18.0"
    sources:
      - path: StickerProbeUITests
    dependencies:
      - target: MemoryPalaceIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.susu.MemoryPalace.ios.uitests
        TEST_TARGET_NAME: MemoryPalaceIOS
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MemoryPalaceIOS:
    build:
      targets:
        MemoryPalaceIOS: all
  StickerProbeUITests:
    build:
      targets:
        MemoryPalaceIOS: all
        StickerProbeUITests: all
    test:
      targets:
        - StickerProbeUITests

