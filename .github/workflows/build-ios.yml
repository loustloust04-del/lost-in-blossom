name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', '.gitignore', 'cc-bridge/**', 'gateway/**', 'mcp-bridge/**', 'design/**']

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup old artifacts
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const old = artifacts.data.artifacts.filter(a => !a.expired);
            console.log(`Found ${old.length} artifacts, deleting all...`);
            for (const a of old) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id,
                });
              } catch (e) {}
            }

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MemoryPalace.xcodeproj \
            -scheme MemoryPalaceIOS

      - name: Install signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          # Create keychain
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          
          # Import certificate
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm /tmp/cert.p12
          
          echo "✅ Signing certificate installed"

      - name: Install provisioning profile
        env:
          MOBILEPROVISION_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$MOBILEPROVISION_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/mp-bunny.mobileprovision
          echo "✅ Provisioning profile installed"

      - name: Archive (signed)
        run: |
          xcodebuild archive \
            -project MemoryPalace.xcodeproj \
            -scheme MemoryPalaceIOS \
            -destination 'generic/platform=iOS' \
            -archivePath build/LiB.xcarchive

      - name: Export .ipa
        run: |
          cat > ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.susu.MemoryPalace.ios</key>
              <string>MP iOS Dev - Bunny</string>
            </dict>
          </dict>
          </plist>
          PLIST
          
          xcodebuild -exportArchive \
            -archivePath build/LiB.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist
          
          IPA=$(find build/export -name "*.ipa" | head -1)
          cp "$IPA" LostInBlossom.ipa
          echo "✅ Signed IPA: $(ls -lh LostInBlossom.ipa | awk '{print $5}')"

      - name: Upload .ipa
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LostInBlossom-Signed
          path: LostInBlossom.ipa
          retention-days: 1

      - name: Deploy to VPS
        if: success()
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -P 48722 -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            LostInBlossom.ipa root@172.245.88.103:/root/projects/lib-web/LostInBlossom.ipa
          scp -P 48722 -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            LostInBlossom.ipa root@172.245.88.103:/var/www/lib-dl/LostInBlossom.ipa
          rm -f /tmp/deploy_key
          echo "✅ Deployed signed IPA to VPS"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain 2>/dev/null || true
