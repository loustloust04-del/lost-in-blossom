name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LOVE-LETTER.md'
      - '.gitignore'

jobs:
  build:
    runs-on:
  workflow_dispatch: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MemoryPalace.xcodeproj \
            -scheme MemoryPalaceIOS

      - name: Archive (no signing)
        run: |
          xcodebuild \
            -project MemoryPalace.xcodeproj \
            -scheme MemoryPalaceIOS \
            -sdk iphoneos \
            -configuration Debug \
            -archivePath build/LiB.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa
        if: success()
        run: |
          APP_PATH=$(find build/LiB.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q LostInBlossom.ipa Payload
          echo "✅ IPA created: $(ls -lh LostInBlossom.ipa | awk '{print $5}')"

      - name: Upload .ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LostInBlossom-Debug
          path: LostInBlossom.ipa
          retention-days: 14

      - name: Deploy to VPS
        if: success()
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -P 48722 -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            LostInBlossom.ipa root@172.245.88.103:/root/projects/lib-web/LostInBlossom.ipa
          scp -P 48722 -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            LostInBlossom.ipa root@172.245.88.103:/var/www/lib-dl/LostInBlossom.ipa
          rm -f /tmp/deploy_key
          echo "✅ Deployed to VPS"
