name: Build iOS

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MemoryPalace.xcodeproj \
            -scheme MemoryPalaceIOS

      - name: Archive (no signing)
        run: |
          xcodebuild \
            -project MemoryPalace.xcodeproj \
            -scheme MemoryPalaceIOS \
            -sdk iphoneos \
            -configuration Debug \
            -archivePath build/LiB.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa
        if: success()
        run: |
          APP_PATH=$(find build/LiB.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q LostInBlossom.ipa Payload
          echo "✅ IPA created: $(ls -lh LostInBlossom.ipa | awk '{print $5}')"

      - name: Upload .ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LostInBlossom-Debug
          path: LostInBlossom.ipa
          retention-days: 14

      - name: Deploy to VPS
        continue-on-error: true
        if: success()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 172.245.88.103
          port: 48722
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "LostInBlossom.ipa"
          target: "/root/projects/lib-web/"
