name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', '.gitignore', 'cc-bridge/**', 'gateway/**', 'mcp-bridge/**', 'design/**']

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const old = artifacts.data.artifacts.filter(a => !a.expired);
            console.log(`Found ${old.length} artifacts, deleting all...`);
            for (const a of old) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: a.id,
                });
                console.log(`Deleted: ${a.id} (${a.name})`);
              } catch (e) {
                console.log(`Skip ${a.id}: ${e.message}`);
              }
            }

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MemoryPalace.xcodeproj \
            -scheme MemoryPalaceIOS

      - name: Archive (no signing)
        run: |
          xcodebuild \
            -project MemoryPalace.xcodeproj \
            -scheme MemoryPalaceIOS \
            -sdk iphoneos \
            -configuration Debug \
            -archivePath build/LiB.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa
        if: success()
        run: |
          APP_PATH=$(find build/LiB.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q LostInBlossom.ipa Payload
          echo "✅ IPA created: $(ls -lh LostInBlossom.ipa | awk '{print $5}')"

      - name: Upload .ipa
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LostInBlossom-Debug
          path: LostInBlossom.ipa
          retention-days: 1

      - name: Deploy to VPS
        if: success()
        run: |
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -P 48722 -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            LostInBlossom.ipa root@172.245.88.103:/root/projects/lib-web/LostInBlossom.ipa
          scp -P 48722 -o StrictHostKeyChecking=no -i /tmp/deploy_key \
            LostInBlossom.ipa root@172.245.88.103:/var/www/lib-dl/LostInBlossom.ipa
          rm -f /tmp/deploy_key
          echo "✅ Deployed to VPS"
